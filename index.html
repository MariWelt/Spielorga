<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielplan · Dienste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#F6F2E9;
    --card:#FFFDF8;
    --ink:#1D2A32;
    --court:#1E4F6B;
    --court-dark:#163B52;
    --gold:#E3A73C;
    --green:#3F7A5C;
    --coral:#C1543A;
    --line:#E4DCC9;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--sand);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.45;}
  h1,h2,h3{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.01em;margin:0;}
  header.top{background:var(--court);color:#fff;padding:18px 20px;}
  header.top .row{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto;flex-wrap:wrap;gap:10px;}
  header.top h1{font-size:1.5rem;text-transform:uppercase;}
  nav.tabs{display:flex;gap:4px;}
  nav.tabs button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;font-family:'Oswald',sans-serif;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em;padding:7px 12px;border-radius:3px;cursor:pointer;}
  nav.tabs button.active{background:#fff;color:var(--court-dark);border-color:#fff;}
  main{max-width:760px;margin:0 auto;padding:22px 18px 60px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
  button.primary{background:var(--court);color:#fff;border:none;padding:10px 16px;font-family:'Oswald',sans-serif;font-size:.9rem;text-transform:uppercase;letter-spacing:.02em;border-radius:3px;cursor:pointer;}
  button.primary:hover{background:var(--court-dark);}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:3px;cursor:pointer;font-family:'Work Sans',sans-serif;font-size:.85rem;}
  button.ghost:hover{border-color:var(--court);}
  .card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:4px;padding:16px 18px;margin-bottom:14px;}
  .card.full{border-left-color:var(--green);}
  .card.clickable{cursor:pointer;}
  .card.clickable:hover{border-left-color:var(--court);}
  .card .meta{font-size:.85rem;color:#5b6a72;margin-top:3px;}
  .card .status{font-family:'Oswald',sans-serif;font-size:.8rem;text-transform:uppercase;margin-top:8px;color:var(--court-dark);}
  .bar-bg{background:#EFE9D8;border-radius:3px;height:6px;margin-top:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--gold);}
  .bar-fill.full{background:var(--green);}
  .empty{text-align:center;padding:40px 20px;color:#7a8790;font-size:.95rem;}
  .dienst-block{border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:12px;background:var(--card);}
  .dienst-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;}
  .dienst-head .name{font-family:'Oswald',sans-serif;font-size:1.05rem;}
  .dienst-head .punkte{font-size:.82rem;color:var(--court-dark);font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .chip{background:var(--sand);border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 12px;font-size:.85rem;display:flex;align-items:center;gap:6px;}
  .chip .x{cursor:pointer;color:var(--coral);font-weight:700;}
  .entry-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  select, input[type=date],input[type=time],input[type=number],input[type=text]{
    padding:9px 10px;border:1px solid var(--line);border-radius:3px;font-family:'Work Sans',sans-serif;font-size:.92rem;background:#fff;
  }
  select{min-width:160px;}
  label{font-size:.82rem;color:#5b6a72;display:block;margin-bottom:4px;}
  .field{margin-bottom:14px;}
  .field input{width:100%;}
  .katalog-pick{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .katalog-pick input[type=checkbox]{width:18px;height:18px;}
  .katalog-pick .lbl{flex:1;min-width:120px;}
  .katalog-pick input[type=number]{width:70px;}
  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);font-size:.92rem;}
  th{font-family:'Oswald',sans-serif;font-size:.78rem;text-transform:uppercase;color:#5b6a72;}
  .points-num{font-family:'Oswald',sans-serif;font-size:1rem;}
  .backlink{background:none;border:none;color:var(--court);font-family:'Oswald',sans-serif;font-size:.9rem;text-transform:uppercase;cursor:pointer;padding:0;margin-bottom:14px;display:inline-block;}
  .hint{font-size:.82rem;color:#8a7550;margin-top:6px;}
  .fehler-banner{margin-top:8px;font-size:.8rem;color:#FBDCA0;background:rgba(0,0,0,.15);padding:8px 10px;border-radius:3px;word-break:break-word;}
  .settings-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- Feste Daten (nicht editierbar) ----------
const KADER = ['Marius','Jojo','Clemens','Wendy','Konrad','Freddy','Marc','Konsti','Jakob','Küchi','Noah','Elias','Domi','David','Paul'];
const DIENSTE_KATALOG = [
  { name:'Ballroller', punkte:5 },
  { name:'Schreiber', punkte:5 },
  { name:'Aufbau', punkte:1 },
  { name:'Abbau', punkte:1 },
  { name:'Tablets', punkte:3 },
  { name:'Werbeaufsteller', punkte:1 },
  { name:'Bier', punkte:3 },
  { name:'Fahrer', punkte:3 }
];

// ---------- Speicher (Chat-interner Artefakt-Speicher) ----------
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=> setTimeout(()=>reject(new Error('Zeitüberschreitung')), ms))
  ]);
}

const BIN_URL = 'https://json.extendsclass.com/bin/0dd37a304b8c';

let spieltage = [];
let dataEverLoaded = false;
let ladeFehler = '';
let speicherFehler = '';

async function ladeSpieltage(){
  let letzterFehlerObj = null;
  for(let i=0;i<3;i++){
    try{
      const res = await withTimeout(fetch(BIN_URL), 8000);
      if(!res.ok){ throw new Error('GET '+res.status); }
      const data = await res.json();
      spieltage = Array.isArray(data.spieltage) ? data.spieltage : [];
      ladeFehler = '';
      dataEverLoaded = true;
      return true;
    }catch(e){
      letzterFehlerObj = e;
      if(i<2) await wait(600);
    }
  }
  if(!dataEverLoaded) spieltage = [];
  ladeFehler = 'Speicher gerade nicht erreichbar' + (letzterFehlerObj ? ' ('+ (letzterFehlerObj.message||letzterFehlerObj) +')' : '') + '. Dein bisheriger Stand wurde nicht verändert.';
  dataEverLoaded = true;
  return false;
}

async function speichereSpieltage(){
  let letzterFehlerObj = null;
  for(let i=0;i<3;i++){
    try{
      const res = await withTimeout(fetch(BIN_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ spieltage })
      }), 8000);
      if(!res.ok){
        const t = await res.text().catch(()=>'');
        throw new Error('PUT '+res.status+' '+t.slice(0,200));
      }
      speicherFehler = '';
      return true;
    }catch(e){
      letzterFehlerObj = e;
      if(i<2) await wait(600);
    }
  }
  speicherFehler = 'Konnte nicht gespeichert werden' + (letzterFehlerObj ? ' ('+ (letzterFehlerObj.message||letzterFehlerObj) +')' : '') + '. Bitte nochmal versuchen, notfalls Sicherung herunterladen.';
  return false;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDatum(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}.${m}.${y}`;
}
function eintragName(e){ return typeof e === 'string' ? e : (e && e.name) || ''; }

function dienstBesetzt(d){ return d.eingetragen.length >= d.benoetigt; }
function spieltagVollstaendig(sp){ return sp.dienste.every(dienstBesetzt); }
function gesamtPlaetze(sp){ return sp.dienste.reduce((s,d)=> s+d.benoetigt, 0); }
function besetztePlaetze(sp){ return sp.dienste.reduce((s,d)=> s+d.eingetragen.length, 0); }

function punkteProSpieler(){
  const map = {};
  KADER.forEach(n=> map[n]=0);
  spieltage.forEach(sp=>{
    sp.dienste.forEach(d=>{
      d.eingetragen.forEach(e=>{
        const name = eintragName(e);
        if(map[name] === undefined) map[name] = 0;
        map[name] += d.punkte;
      });
    });
  });
  return map;
}

let view = { name:'uebersicht' };
function setView(v){ view = v; render(); }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="top">
      <div class="row">
        <h1>Spielplan</h1>
      </div>
      <div class="row" style="margin-top:10px;">
        <nav class="tabs">
          <button class="${view.name==='uebersicht'?'active':''}" onclick="setView({name:'uebersicht'})">Übersicht</button>
          <button class="${view.name==='punkte'?'active':''}" onclick="setView({name:'punkte'})">Punkte</button>
          <button class="${view.name==='sicherung'?'active':''}" onclick="setView({name:'sicherung'})">Sicherung</button>
        </nav>
        <button class="ghost" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.35);" onclick="refresh()">↻ Aktualisieren</button>
      </div>
      ${ladeFehler? `<div class="fehler-banner">⚠ ${escapeHtml(ladeFehler)}</div>` : ''}
      ${speicherFehler? `<div class="fehler-banner">⚠ ${escapeHtml(speicherFehler)}</div>` : ''}
    </header>
    <main id="main"></main>
  `;
  const main = document.getElementById('main');
  if(view.name==='uebersicht') main.innerHTML = renderUebersicht();
  else if(view.name==='neu') main.innerHTML = renderForm(null);
  else if(view.name==='bearbeiten') main.innerHTML = renderForm(view.spieltagId);
  else if(view.name==='detail') main.innerHTML = renderDetail(view.spieltagId);
  else if(view.name==='punkte') main.innerHTML = renderPunkte();
  else if(view.name==='sicherung') main.innerHTML = renderSicherung();
}

async function refresh(){
  await ladeSpieltage();
  render();
}

// ---------- Übersicht ----------
function renderUebersicht(){
  const sorted = [...spieltage].sort((a,b)=> (a.datum||'').localeCompare(b.datum||''));
  const cards = sorted.map(sp=>{
    const voll = spieltagVollstaendig(sp);
    const gesamt = gesamtPlaetze(sp);
    const besetzt = besetztePlaetze(sp);
    const pct = gesamt ? Math.round(besetzt/gesamt*100) : 100;
    return `
      <div class="card clickable ${voll?'full':''}" onclick="setView({name:'detail', spieltagId:'${sp.id}'})">
        <h3>${fmtDatum(sp.datum)}${sp.uhrzeit? ' · '+sp.uhrzeit+' Uhr':''}</h3>
        <div class="meta">${sp.gegner? 'gegen '+escapeHtml(sp.gegner) : ''}${sp.ort? ' · '+escapeHtml(sp.ort) : ''}</div>
        <div class="status">${besetzt}/${gesamt} Dienste besetzt</div>
        <div class="bar-bg"><div class="bar-fill ${voll?'full':''}" style="width:${pct}%;"></div></div>
      </div>
    `;
  }).join('');
  return `
    <div class="toolbar">
      <h2>Kommende Spieltage</h2>
      <button class="primary" onclick="setView({name:'neu'})">+ Neuer Spieltag</button>
    </div>
    ${sorted.length? cards : '<div class="empty">Noch keine Spieltage angelegt. Leg den ersten Spieltag an.</div>'}
  `;
}

// ---------- Neu / Bearbeiten ----------
function renderForm(spieltagId){
  const sp = spieltagId ? spieltage.find(s=>s.id===spieltagId) : null;
  const rows = DIENSTE_KATALOG.map((d,i)=>{
    const bestehend = sp ? sp.dienste.find(x=>x.name===d.name) : null;
    return `
    <div class="katalog-pick">
      <input type="checkbox" id="pick-${i}" ${bestehend?'checked':''}>
      <div class="lbl">${escapeHtml(d.name)} <span style="color:#8a7550;font-size:.8rem;">(${d.punkte} Pkt.)</span>
        ${bestehend && bestehend.eingetragen.length? `<div class="hint">${bestehend.eingetragen.length} bereits eingetragen – bei Entfernen gehen diese Einträge verloren.</div>` : ''}
      </div>
      <label style="margin:0;">Anzahl
        <input type="number" id="anz-${i}" min="1" value="${bestehend? bestehend.benoetigt : 1}">
      </label>
    </div>`;
  }).join('');
  return `
    <button class="backlink" onclick="setView(${sp? `{name:'detail', spieltagId:'${sp.id}'}` : `{name:'uebersicht'}`})">← Zurück</button>
    <h2 style="margin-bottom:16px;">${sp? 'Spieltag bearbeiten' : 'Neuen Spieltag anlegen'}</h2>
    <div class="field"><label>Datum</label><input type="date" id="f-datum" value="${sp? sp.datum||'':''}"></div>
    <div class="field"><label>Uhrzeit</label><input type="time" id="f-uhrzeit" value="${sp? sp.uhrzeit||'':''}"></div>
    <div class="field"><label>Ort</label><input type="text" id="f-ort" value="${sp? escapeHtml(sp.ort||''):''}" placeholder="z.B. Sporthalle 3"></div>
    <div class="field"><label>Gegner / Beschreibung</label><input type="text" id="f-gegner" value="${sp? escapeHtml(sp.gegner||''):''}" placeholder="z.B. SG Musterstadt"></div>
    <div class="field">
      <label>Benötigte Dienste</label>
      ${rows}
    </div>
    <button class="primary" onclick="formSpeichern(${sp? `'${sp.id}'` : 'null'})">${sp? 'Änderungen speichern' : 'Spieltag speichern'}</button>
  `;
}

async function formSpeichern(spieltagId){
  const datum = document.getElementById('f-datum').value;
  if(!datum){ alert('Bitte ein Datum angeben.'); return; }
  const uhrzeit = document.getElementById('f-uhrzeit').value;
  const ort = document.getElementById('f-ort').value.trim();
  const gegner = document.getElementById('f-gegner').value.trim();

  let sp = spieltagId ? spieltage.find(s=>s.id===spieltagId) : null;
  const alteDienste = sp ? sp.dienste : [];

  const entfernteMitEintraegen = [];
  const neueDienste = [];
  DIENSTE_KATALOG.forEach((d,i)=>{
    const box = document.getElementById(`pick-${i}`);
    const bestehend = alteDienste.find(x=>x.name===d.name);
    if(box && box.checked){
      const anz = parseInt(document.getElementById(`anz-${i}`).value) || 1;
      if(bestehend){
        bestehend.benoetigt = anz;
        bestehend.punkte = d.punkte;
        neueDienste.push(bestehend);
      }else{
        neueDienste.push({ id: uid(), name: d.name, punkte: d.punkte, benoetigt: anz, eingetragen: [] });
      }
    }else if(bestehend && bestehend.eingetragen.length){
      entfernteMitEintraegen.push(d.name);
    }
  });
  if(entfernteMitEintraegen.length){
    const ok = confirm(`Beim Speichern gehen die Einträge für folgende Dienste verloren: ${entfernteMitEintraegen.join(', ')}. Fortfahren?`);
    if(!ok) return;
  }

  if(sp){
    sp.datum = datum; sp.uhrzeit = uhrzeit; sp.ort = ort; sp.gegner = gegner; sp.dienste = neueDienste;
  }else{
    sp = { id: uid(), datum, uhrzeit, ort, gegner, dienste: neueDienste };
    spieltage.push(sp);
  }

  await speichereSpieltage();
  setView({name:'detail', spieltagId: sp.id});
}

async function spieltagLoeschen(id){
  const sp = spieltage.find(s=>s.id===id);
  if(!sp) return;
  const ok = confirm(`Spieltag am ${fmtDatum(sp.datum)} wirklich löschen? Das kann nicht rückgängig gemacht werden.`);
  if(!ok) return;
  spieltage = spieltage.filter(s=>s.id!==id);
  await speichereSpieltage();
  setView({name:'uebersicht'});
}

// ---------- Detail ----------
function renderDetail(id){
  const sp = spieltage.find(s=>s.id===id);
  if(!sp) return '<div class="empty">Spieltag nicht gefunden.</div>';
  const blocks = sp.dienste.map(d=>{
    const offen = d.benoetigt - d.eingetragen.length;
    const belegteNamen = d.eingetragen.map(eintragName);
    const chips = d.eingetragen.map((e,idx)=>`
      <div class="chip">${escapeHtml(eintragName(e))}
        <span class="x" onclick="eintragEntfernen('${sp.id}','${d.id}',${idx})">✕</span>
      </div>
    `).join('');
    const optionen = KADER.filter(n=>!belegteNamen.includes(n))
      .map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
    return `
      <div class="dienst-block">
        <div class="dienst-head">
          <div class="name">${escapeHtml(d.name)}</div>
          <div class="punkte">${d.punkte} Punkte · ${d.eingetragen.length}/${d.benoetigt} besetzt</div>
        </div>
        <div class="chips">${chips || '<span class="hint">Noch niemand eingetragen.</span>'}</div>
        ${offen>0? `
          <div class="entry-row">
            <select id="sel-${d.id}">
              <option value="">-- Name wählen --</option>
              ${optionen}
            </select>
            <button class="primary" onclick="eintragen('${sp.id}','${d.id}')">Eintragen</button>
          </div>
        `: '<div class="hint">Alle Plätze besetzt.</div>'}
      </div>
    `;
  }).join('');
  return `
    <button class="backlink" onclick="setView({name:'uebersicht'})">← Zurück zur Übersicht</button>
    <div class="toolbar" style="align-items:flex-start;">
      <div>
        <h2>${fmtDatum(sp.datum)}${sp.uhrzeit? ' · '+sp.uhrzeit+' Uhr':''}</h2>
        <div class="meta">${sp.gegner? 'gegen '+escapeHtml(sp.gegner) : ''}${sp.ort? ' · '+escapeHtml(sp.ort) : ''}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="ghost" onclick="setView({name:'bearbeiten', spieltagId:'${sp.id}'})">✎ Bearbeiten</button>
        <button class="ghost" onclick="spieltagLoeschen('${sp.id}')">🗑 Löschen</button>
      </div>
    </div>
    ${blocks || '<div class="empty">Für diesen Spieltag sind keine Dienste hinterlegt.</div>'}
  `;
}

async function eintragen(spId, dienstId){
  const sel = document.getElementById(`sel-${dienstId}`);
  const name = sel.value;
  if(!name) return;
  const sp = spieltage.find(s=>s.id===spId);
  const d = sp.dienste.find(x=>x.id===dienstId);
  if(d.eingetragen.length >= d.benoetigt){ alert('Dieser Dienst ist bereits voll besetzt.'); return; }
  d.eingetragen.push(name);
  await speichereSpieltage();
  render();
}

async function eintragEntfernen(spId, dienstId, idx){
  const sp = spieltage.find(s=>s.id===spId);
  const d = sp.dienste.find(x=>x.id===dienstId);
  d.eingetragen.splice(idx,1);
  await speichereSpieltage();
  render();
}

// ---------- Punkte ----------
function renderPunkte(){
  const map = punkteProSpieler();
  const namen = Object.keys(map).sort((a,b)=> map[b]-map[a]);
  const max = Math.max(1, ...namen.map(n=>map[n]));
  const rows = namen.map(n=>{
    const p = map[n];
    const pct = Math.round(p/max*100);
    return `
      <tr>
        <td>${escapeHtml(n)}</td>
        <td class="points-num">${p}</td>
        <td style="width:40%;"><div class="bar-bg"><div class="bar-fill" style="width:${pct}%;"></div></div></td>
      </tr>
    `;
  }).join('');
  return `
    <h2 style="margin-bottom:16px;">Punkteübersicht</h2>
    <table>
      <thead><tr><th>Name</th><th>Punkte</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// ---------- Sicherung ----------
function renderSicherung(){
  return `
    <h2 style="margin-bottom:16px;">Datensicherung</h2>
    <div class="hint" style="margin-bottom:14px;">Der Speicher hier im Chat ist praktisch, aber nicht zu 100% zuverlässig. Lade dir hin und wieder eine Sicherung herunter – falls mal was verschwindet, kannst du sie wieder einspielen.</div>
    <div class="settings-row">
      <button class="ghost" onclick="datenSichern()">⬇ Sicherung herunterladen</button>
      <label class="ghost" style="cursor:pointer;display:inline-flex;align-items:center;">
        ⬆ Sicherung einspielen
        <input type="file" accept="application/json" style="display:none;" onchange="datenWiederherstellen(this)">
      </label>
    </div>
  `;
}

function datenSichern(){
  const backup = { spieltage, exportiertAm: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `spielplan-sicherung-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function datenWiederherstellen(input){
  const file = input.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!Array.isArray(backup.spieltage)){ alert('Diese Datei sieht nicht wie eine gültige Sicherung aus.'); return; }
    const ok = confirm('Aktuellen Stand mit dieser Sicherung überschreiben? Das kann nicht rückgängig gemacht werden.');
    if(!ok) return;
    spieltage = backup.spieltage;
    await speichereSpieltage();
    render();
  }catch(e){
    alert('Die Datei konnte nicht gelesen werden.');
  }
  input.value = '';
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

(async function init(){
  document.getElementById('app').innerHTML = '<div class="empty">Lädt…</div>';
  await ladeSpieltage();
  render();
  setInterval(async ()=>{
    if(view.name==='uebersicht' || view.name==='punkte'){
      await ladeSpieltage();
      render();
    }
  }, 45000);
})();
</script>
